name: Download statistics

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: download-statistics
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - name: Test the collector
        run: python3 scripts/test_downloads.py
      - name: Collect aggregate release counters
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/collect-downloads.py
      - name: Save the daily snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stats
          if ! git diff --cached --quiet; then
            git commit -m 'Update daily download statistics'
            git push origin HEAD:main
          fi
